{% extends "base.html" %}

{% block title %}Welcome {% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="text-center mb-4">Welcome to MongoDBank</h1>
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Login</h2>
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Login</button>
                        <button type="button" class="btn btn-info" onclick="showCode('login')">Show Login Logic</button>
                    </div>
                </form>
                
                <!-- Demo User Buttons -->
                <div class="mt-4">
                    <h6 class="text-center text-muted mb-3">Demo Users</h6>
                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" class="btn btn-outline-success w-100" onclick="fillDemoUser('johndoe', 'password123')">
                                <small>John Doe<br><span class="text-muted">Business Owner</span></small>
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-outline-info w-100" onclick="fillDemoUser('sarahsmith', 'password123')">
                                <small>Sarah Smith<br><span class="text-muted">Software Engineer</span></small>
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-outline-warning w-100" onclick="fillDemoUser('mikejohnson', 'password123')">
                                <small>Mike Johnson<br><span class="text-muted">Retiree</span></small>
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-outline-danger w-100" onclick="fillDemoUser('admin', 'mongodb123')">
                                <small>Admin User<br><span class="text-muted">Bank Manager</span></small>
                            </button>
                        </div>
                    </div>
                </div>
                
                <script>
                function fillDemoUser(username, password) {
                    document.getElementById('username').value = username;
                    document.getElementById('password').value = password;
                }
                </script>
            </div>
        </div>
    </div>
</div>
{% endblock %}
